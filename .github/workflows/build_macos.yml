name: Build MacOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          submodules: false

      - name: Sync submodules
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4

      - name: Setup .NET SDK
        timeout-minutes: 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'

      - name: Restore managed scripting projects
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Managed/Nullus.ScriptGenerator/Nullus.ScriptGenerator.csproj --nologo
          dotnet restore Managed/Nullus.ScriptAnalysis/Nullus.ScriptAnalysis.csproj --nologo
          dotnet restore Managed/Nullus.Managed/Nullus.Managed.csproj --nologo
          dotnet restore Managed/Nullus.EngineScripts/Nullus.EngineScripts.csproj --nologo
          dotnet restore Managed/Nullus.GameScripts/Nullus.GameScripts.csproj --nologo
          dotnet restore Managed/Nullus.GameScriptsEditor/Nullus.GameScriptsEditor.csproj --nologo
          dotnet restore Managed/Nullus.Editor/Nullus.Editor.csproj --nologo

      - name: Install native shader compiler
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          sdk_version="1.4.335.1"
          installer_root="${RUNNER_TEMP}/nullus-vulkan-installer"
          sdk_root="${RUNNER_TEMP}/nullus-vulkan-sdk"
          mkdir -p "$installer_root"
          curl --fail --location --retry 3 --retry-delay 5 \
            "https://sdk.lunarg.com/sdk/download/${sdk_version}/mac/vulkansdk-macos-${sdk_version}.zip" \
            -o "${RUNNER_TEMP}/nullus-vulkan-sdk.zip"
          unzip -q "${RUNNER_TEMP}/nullus-vulkan-sdk.zip" -d "$installer_root"
          installer_app="$(find "$installer_root" -maxdepth 3 -type d -name '*.app' -print -quit)"
          test -n "$installer_app"
          installer_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$installer_app/Contents/Info.plist")"
          "$installer_app/Contents/MacOS/$installer_executable" \
            --root "$sdk_root" --accept-licenses --default-answer --confirm-command install copy_only=1
          dxc_path="${sdk_root}/macOS/bin/dxc"
          test -x "$dxc_path"
          export DYLD_LIBRARY_PATH="${sdk_root}/macOS/lib:${DYLD_LIBRARY_PATH:-}"
          "$dxc_path" --version
          printf '[numthreads(1,1,1)] void main(uint3 id : SV_DispatchThreadID) {}\n' > "${RUNNER_TEMP}/nullus-dxc-check.hlsl"
          "$dxc_path" -E main -T cs_6_0 -Fo "${RUNNER_TEMP}/nullus-dxc-check.dxil" "${RUNNER_TEMP}/nullus-dxc-check.hlsl"
          "$dxc_path" -spirv -E main -T cs_6_0 -Fo "${RUNNER_TEMP}/nullus-dxc-check.spv" "${RUNNER_TEMP}/nullus-dxc-check.hlsl"
          # Export only compiler paths so CMake keeps the existing backend selection.
          echo "DXC_PATH=$dxc_path" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Build
        timeout-minutes: 240
        shell: bash
        run: |
          set -o pipefail
          NLS_CMAKE_OPTIONS="-DNLS_BUILD_TESTS=ON" NLS_BUILD_TARGETS="NullusUnitTests ReflectionTest" NLS_BUILD_JOBS=2 ./build_macos.sh debug 2>&1 | tee "build_macos_debug.log"

      - name: Dump build log on failure
        if: failure()
        shell: bash
        run: |
          if [[ -f "build_macos_debug.log" ]]; then
            echo "::group::Last 200 lines of macOS build log"
            tail -n 200 "build_macos_debug.log"
            echo "::endgroup::"
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(tail -n 20 "build_macos_debug.log")
          fi

      - name: Run unit tests
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          ls -R build/macos/bin || true
          NULLUS_UNIT_TESTS="$(find build/macos -type f -name NullusUnitTests | head -n 1)"
          REFLECTION_TEST="$(find build/macos -type f -name ReflectionTest | head -n 1)"
          echo "NullusUnitTests: ${NULLUS_UNIT_TESTS}"
          echo "ReflectionTest: ${REFLECTION_TEST}"
          test -n "${NULLUS_UNIT_TESTS}"
          test -n "${REFLECTION_TEST}"
          file "${NULLUS_UNIT_TESTS}" || true
          file "${REFLECTION_TEST}" || true
          run_test() {
            local label="$1"
            local log_path="$2"
            shift 2
            echo "Running ${label}"
            set +e
            "$@" 2>&1 | tee "${log_path}"
            local test_exit=${PIPESTATUS[0]}
            set -e
            if [[ ${test_exit} -ne 0 ]]; then
              echo "::error::${label} failed with exit code ${test_exit}"
              while IFS= read -r line; do
                echo "::error::$line"
              done < <(tail -n 200 "${log_path}")
              exit "${test_exit}"
            fi
          }
          run_test "NullusUnitTests" nullus_unit_tests.log "${NULLUS_UNIT_TESTS}"
          run_test "ReflectionTest" reflection_test.log "${REFLECTION_TEST}"
