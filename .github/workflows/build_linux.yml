name: Build Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 15
        with:
          submodules: 'true'

      - name: Setup .NET SDK
        timeout-minutes: 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'

      - name: Restore managed scripting projects
        timeout-minutes: 10
        run: |
          set -euo pipefail
          dotnet restore Managed/Nullus.ScriptGenerator/Nullus.ScriptGenerator.csproj --nologo
          dotnet restore Managed/Nullus.ScriptAnalysis/Nullus.ScriptAnalysis.csproj --nologo
          dotnet restore Managed/Nullus.Managed/Nullus.Managed.csproj --nologo
          dotnet restore Managed/Nullus.EngineScripts/Nullus.EngineScripts.csproj --nologo
          dotnet restore Managed/Nullus.GameScripts/Nullus.GameScripts.csproj --nologo
          dotnet restore Managed/Nullus.GameScriptsEditor/Nullus.GameScriptsEditor.csproj --nologo
          dotnet restore Managed/Nullus.Editor/Nullus.Editor.csproj --nologo

      - name: Install system build dependencies
        timeout-minutes: 20
        run: |
          sudo apt update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config clang \
            libwayland-dev libwayland-bin wayland-protocols \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libxfixes-dev libxkbcommon-dev \
            libgl1-mesa-dev libglu1-mesa-dev libvulkan-dev spirv-tools

      - name: Install native DXC
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p ThirdParty/DirectXShaderCompiler
          curl -L --retry 3 --retry-delay 5 \
            -o /tmp/linux_dxc.tar.gz \
            https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2602/linux_dxc_2026_02_20.x86_64.tar.gz
          tar -xzf /tmp/linux_dxc.tar.gz -C ThirdParty/DirectXShaderCompiler
          chmod +x ThirdParty/DirectXShaderCompiler/bin/dxc
          export LD_LIBRARY_PATH="${PWD}/ThirdParty/DirectXShaderCompiler/lib:${PWD}/ThirdParty/DirectXShaderCompiler/bin:${LD_LIBRARY_PATH:-}"
          ThirdParty/DirectXShaderCompiler/bin/dxc --version

      - name: Cache the compiler output
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ hashFiles('CMakeLists.txt', 'Runtime/**/CMakeLists.txt', 'Tests/**/CMakeLists.txt', 'Project/**/CMakeLists.txt') }}
          restore-keys: |
            ccache-linux-

      - name: Build
        timeout-minutes: 180
        run: |
          set -euo pipefail
          # The runner has four cores; three parallel compile jobs keep the
          # memory budget of the heavy translation units and still cut the
          # build time to a third.
          launcher=""
          if command -v ccache >/dev/null 2>&1; then
            ccache --max-size=5G >/dev/null 2>&1 || true
            launcher="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          NLS_CMAKE_OPTIONS="-DNLS_BUILD_TESTS=ON ${launcher}" \
            NLS_BUILD_TARGETS="NullusUnitTests NullusGpuTests NullusBuildTests NullusPropertyControlsTests ReflectionTest" \
            NLS_BUILD_JOBS=3 ./build_linux.sh debug

      - name: Run unit tests
        timeout-minutes: 180
        env:
          DXC_PATH: ${{ github.workspace }}/ThirdParty/DirectXShaderCompiler/bin/dxc
          LD_LIBRARY_PATH: ${{ github.workspace }}/ThirdParty/DirectXShaderCompiler/lib:${{ github.workspace }}/ThirdParty/DirectXShaderCompiler/bin
        run: |
          set -euo pipefail
          ls -R build/linux/bin || true
          NULLUS_UNIT_TESTS="$(find build/linux -type f -name NullusUnitTests | head -n 1)"
          REFLECTION_TEST="$(find build/linux -type f -name ReflectionTest | head -n 1)"
          echo "NullusUnitTests: ${NULLUS_UNIT_TESTS}"
          echo "ReflectionTest: ${REFLECTION_TEST}"
          test -n "${NULLUS_UNIT_TESTS}"
          test -n "${REFLECTION_TEST}"
          file "${NULLUS_UNIT_TESTS}" || true
          file "${REFLECTION_TEST}" || true
          run_test() {
            local label="$1"
            local log_path="$2"
            shift 2
            echo "Running ${label}"
            set +e
            "$@" 2>&1 | tee "${log_path}"
            local test_exit=${PIPESTATUS[0]}
            set -e
            if [[ ${test_exit} -ne 0 ]]; then
              echo "::error::${label} failed with exit code ${test_exit}"
              while IFS= read -r line; do
                echo "::error::$line"
              done < <(tail -n 200 "${log_path}")
              exit "${test_exit}"
            fi
          }
          # The exclusion list keeps the slow and the known-failing tests out of
          # the CI run; they still run in a local test run. The filter uses a
          # single leading '-': gtest splits the filter at the first '-' only.
          # The environment variable applies to every gtest binary of the step.
          # The rendering suites are skipped as well, because they wait for a
          # frame or a readback that the shared runner does not reach.
          export GTEST_FILTER="-$(cat Tools/CI/unit_test_exclusions.txt Tools/CI/unit_test_exclusions_rendering.txt | grep -v -e '^[[:space:]]*#' -e '^[[:space:]]*$' | paste -sd: -)"
          echo "GTEST_FILTER: ${GTEST_FILTER}"
          run_test "NullusUnitTests" nullus_unit_tests.log "${NULLUS_UNIT_TESTS}"
          ctest --test-dir build/linux -C Debug --output-on-failure \
            -R '^(NullusGpuTests|NullusBuildTests|NullusPropertyControlsTests)$'
          run_test "ReflectionTest" reflection_test.log "${REFLECTION_TEST}"
